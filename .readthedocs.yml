version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - python -m mkdocs build --verbose --clean --site-dir $READTHEDOCS_OUTPUT/html --config-file mkdocs.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

mkdocs:
  configuration: mkdocs.yml
